<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atomic Clock</title>
<meta name="theme-color" content="#0b0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Atomic Clock">
<link rel="manifest" href="manifest.json?v=5">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: black LCD screen — day, date and time stacked dead-centre; sync status and controls pinned to the bottom */
:root{
  --bg:#0b0f12; --fg:#ffffff; --muted:#8d969b; --line:#2a3238; --ok:#2fd14f; --warn:#f0a43a; --bad:#e5383b;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* LCD unit: script sets this so the display fills the screen in either orientation */
  --u:12vw;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--sans);
  display:flex; flex-direction:column; text-align:center; overflow:hidden;
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
main{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--u)*.2)}
.row{display:flex; align-items:flex-end; justify-content:center; font-size:var(--u); line-height:1}
.daydate{display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*.2); font-size:calc(var(--u)*.78)}
.daydate .row{font-size:1em}
/* Landscape: day and date share one line so the time can grow to fill the width */
@media (orientation:landscape){
  .daydate{flex-direction:row; gap:.7em; font-size:calc(var(--u)*.5)}
  main{gap:calc(var(--u)*.16)}
}
/* LCD characters drawn in-page: 14-segment style, rounded bars, faint unlit segments; fixed widths so nothing shifts */
.row svg{display:block; height:1em; width:.635em; margin:0 .05em; overflow:visible}
.row svg.sep{width:.21em; margin:0}
.row line{stroke:var(--fg); stroke-linecap:round}
.row line.off{opacity:.06}
.row circle{fill:var(--fg)}

/* Which timezone the clock shows */
.tz{font-family:var(--sans); font-weight:700; font-size:calc(var(--u)*.2); letter-spacing:.08em; color:var(--muted); white-space:nowrap}
#place{flex-shrink:0; font-size:clamp(.8rem,2.6vmin,1.05rem); color:var(--muted); line-height:1.35; height:2.8em; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
#place[hidden]{display:block; visibility:hidden}
#place b{color:var(--fg); font-weight:600}

footer{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:.8rem 1rem; text-align:left; font-size:.8rem; color:var(--muted)}
.cam{width:100%; display:flex; justify-content:center; align-items:center; gap:.5rem; min-width:0}
.cam select,.cam input{font:inherit; font-size:.95rem; color:var(--fg); background:var(--line); border:1px solid transparent; border-radius:8px; padding:.45rem .6rem; min-width:0}
.cam input{width:7.5rem; flex-shrink:0; text-transform:uppercase; letter-spacing:.06em}
.cam input::placeholder{text-transform:none; letter-spacing:0; color:var(--muted)}
.cam select:focus-visible,.cam input:focus-visible{outline:2px solid var(--fg); outline-offset:1px}
/* Camera label shown on the clock face, so every sync photo says which camera it is */
.camlabel{font-family:var(--sans); font-weight:900; font-size:calc(var(--u)*var(--labk,.68)); line-height:1; letter-spacing:.04em; white-space:nowrap;
  background:var(--fg); color:var(--bg); padding:.14em .38em .12em; border-radius:.14em}
.camlabel:empty{display:none}
#status{display:flex; flex-direction:column; gap:.15rem; min-width:0}
#syncText{color:var(--muted)}
.ok #syncText{color:var(--ok)}
.bad #syncText{color:var(--warn)}
#detail{font-variant-numeric:tabular-nums}
.controls{display:flex; align-items:center; gap:1.1rem; flex-shrink:0}
.controls button{font:inherit; color:var(--fg); background:none; border:0; padding:.3rem 0; text-decoration:underline; text-underline-offset:3px; cursor:pointer}
.switch{display:inline-flex; align-items:center; gap:.5rem; color:var(--fg); cursor:pointer; position:relative}
.switch input{position:absolute; opacity:0; width:1px; height:1px}
.switch .track{width:2.4rem; height:1.4rem; border-radius:999px; background:var(--line); position:relative; transition:background .15s}
.switch .knob{position:absolute; top:.15rem; left:.15rem; width:1.1rem; height:1.1rem; border-radius:50%; background:var(--fg); transition:transform .15s}
.switch input:checked + .track{background:var(--fg)}
.switch input:checked + .track .knob{transform:translateX(1rem); background:var(--bg)}
.controls button:focus-visible,.switch input:focus-visible + .track{outline:2px solid var(--fg); outline-offset:2px}
/* Camera settings button + sheet */
/* Shown while location is on: a photo of the screen reveals the exact position */
.locwarn{font-size:.85em; font-weight:600; color:var(--warn)}
/* Camera settings: a full-width button with the tick count; red until all four are done */
.setbtn{width:100%; display:flex; align-items:center; justify-content:center; gap:.6rem;
  font:inherit; font-size:1.15rem; font-weight:800; letter-spacing:.02em; color:var(--fg);
  background:transparent; border:2px solid var(--bad); border-radius:12px; padding:.7rem 1rem; cursor:pointer}
.setbtn b{font-size:1.25rem; font-weight:900; color:#fff; background:var(--bad); border-radius:999px; padding:.05rem .65rem; font-variant-numeric:tabular-nums}
.setbtn.done{border-color:var(--ok)}
.setbtn.done b{background:var(--ok); color:#06210e}
.setbtn:focus-visible{outline:2px solid var(--fg); outline-offset:2px}
.sheet{position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center}
.sheet[hidden]{display:none}
.sheet-panel{width:100%; max-width:34rem; max-height:88%; overflow:auto; background:#151b1f; color:var(--fg); border-radius:16px 16px 0 0;
  padding-block:1rem max(1.2rem, env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:.9rem; text-align:left; font-size:.95rem}
.sheet-head{display:flex; align-items:center; justify-content:space-between}
.sheet-head h2{margin:0; font-size:1.1rem}
.sheet-head button{font:inherit; font-weight:700; color:var(--bg); background:var(--fg); border:0; border-radius:999px; padding:.4rem 1rem; cursor:pointer}
.pick{display:flex; gap:.5rem}
.pick select{flex:1; min-width:0; font:inherit; color:var(--fg); background:var(--line); border:0; border-radius:8px; padding:.6rem .6rem}
.recent{display:flex; flex-wrap:wrap; gap:.4rem}
.recent:empty{display:none}
.recent button{font:inherit; font-size:.82rem; color:var(--fg); background:transparent; border:1px solid #3a444b; border-radius:999px; padding:.3rem .75rem; cursor:pointer}
.recent button.cur{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.checklist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.5rem}
.checklist label{display:flex; gap:.75rem; align-items:flex-start; background:#1d252a; border-radius:10px; padding:.7rem .8rem; cursor:pointer}
.checklist input{width:1.3rem; height:1.3rem; margin:.1rem 0 0; accent-color:var(--ok); flex-shrink:0}
.checklist .t{display:block; font-weight:700}
.checklist .d{display:block; color:#c9d1d5; font-size:.88rem; line-height:1.35; margin-top:.15rem}
.checklist .d b{color:var(--fg)}
.checklist input:checked ~ span .t{color:var(--ok)}
.sheet-note{margin:0; font-size:.78rem; color:var(--muted); line-height:1.4}
/* Camera strip (main screen) and tabs (panel) */
.strip{display:flex; gap:.4rem; overflow-x:auto; min-width:0; scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex-shrink:0; display:inline-flex; align-items:center; gap:.35rem; font:inherit; font-size:.85rem; font-weight:700; color:var(--fg);
  background:var(--line); border:2px solid transparent; border-radius:999px; padding:.35rem .7rem; cursor:pointer; white-space:nowrap}
.chip .st{font-weight:800; font-variant-numeric:tabular-nums; color:var(--bad)}
.chip.ok .st{color:var(--ok)}
.chip.none .st{color:var(--muted)}
.chip.act{border-color:var(--fg)}
.chip.plus{min-width:2.3rem; justify-content:center; font-size:1.05rem; background:transparent; border:2px dashed #56626a}
.chip.plusopt{background:transparent; border:2px dashed var(--ok); color:var(--ok)}
.chip:disabled{opacity:.35; cursor:default}
.chip:focus-visible,.addbtn:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--fg); outline-offset:2px}
.kit{display:flex; flex-direction:column; gap:.55rem}
.addrow{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap}
.addbtn{font:inherit; font-size:.85rem; font-weight:700; color:var(--fg); background:transparent; border:1px dashed #56626a; border-radius:999px; padding:.3rem .8rem; cursor:pointer}
.addbtn:disabled{opacity:.35; cursor:default}
.linkbtn{margin-left:auto; font:inherit; font-size:.8rem; color:var(--muted); background:none; border:0; text-decoration:underline; cursor:pointer}
.linkbtn[hidden]{display:none}
.endrow{display:flex; justify-content:center; gap:.6rem; flex-wrap:wrap}
.resetbtn.neutral{color:var(--fg); border-color:#56626a}
/* Next-camera prompt, shown after a camera's four checks are done */
.nextbar{position:fixed; left:0; right:0; bottom:0; z-index:9; display:flex; align-items:center; gap:.7rem;
  background:#12301b; border-top:2px solid var(--ok); color:var(--fg);
  padding-block:.8rem max(.8rem, env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.nextbar[hidden]{display:none}
.nb-msg{flex:1; min-width:0; display:flex; flex-direction:column; text-align:left}
.nb-msg b{color:var(--ok); font-size:1rem}
.nb-msg span{font-size:.85rem; color:#cfe9d6}
.nb-next{flex-shrink:0; font:inherit; font-weight:800; font-size:1rem; color:#06210e; background:var(--ok); border:0; border-radius:10px; padding:.6rem 1rem; cursor:pointer}
.nb-close{flex-shrink:0; font:inherit; font-size:1.1rem; color:var(--fg); background:none; border:0; padding:.3rem .4rem; cursor:pointer}
.nb-next:focus-visible,.nb-close:focus-visible{outline:2px solid var(--fg); outline-offset:2px}
.resetbtn{align-self:center; font:inherit; font-size:.9rem; font-weight:700; color:var(--bad); background:transparent; border:1.5px solid var(--bad); border-radius:999px; padding:.45rem 1.1rem; cursor:pointer; margin-top:.2rem}
.resetbtn.armed{background:var(--bad); color:#fff}
.resetbtn:focus-visible{outline:2px solid var(--fg); outline-offset:2px}
.sheet button:focus-visible,.sheet select:focus-visible,.checklist input:focus-visible{outline:2px solid var(--fg); outline-offset:2px}
/* Landscape: everything at the bottom on one compact line, so the clock gets the height */
@media (orientation:landscape){
  footer{flex-wrap:nowrap; align-items:center; gap:.9rem}
  .setbtn{width:auto; flex-shrink:0; font-size:.95rem; padding:.4rem .85rem; border-radius:10px}
  .setbtn b{font-size:1rem}
  .cam{width:auto; flex-shrink:1; max-width:45%}
  .cam select,.cam input{padding:.35rem .5rem}
  .cam input{width:6.5rem}
  #status{flex:1; min-width:0}
  #syncText{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #detail{display:none}
}
@media (max-width:420px){ footer{flex-direction:column; align-items:center; text-align:center} #status{align-items:center} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main aria-live="off">
  <div id="camLabel" class="camlabel" aria-label="Camera"></div>
  <div class="daydate">
    <div class="row" id="dayRow" aria-label="Day"></div>
    <div class="row" id="dateRow" aria-label="Date"></div>
  </div>
  <div class="row" id="timeRow" aria-label="Time"></div>
  <div class="tz" id="tz"></div>
  <div id="place"><b id="suburb">Finding you…</b> <span id="coords"></span><div class="locwarn">⚠️ Exact GPS location visible on screen ⚠️</div></div>
</main>

<footer>
  <button id="setBtn" class="setbtn" type="button" aria-haspopup="dialog">Camera check <b id="setCount">0/4</b></button>
  <div class="cam" aria-label="Camera label">
    <input id="camInit" type="text" maxlength="6" placeholder="SG initials" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="SG initials">
    <div id="strip" class="strip" aria-label="My cameras"></div>
  </div>
  <div id="status">
    <span id="syncText">Syncing with time server…</span>
    <span id="detail"></span>
  </div>
  <div class="controls">
    <button id="resync" type="button">Sync now</button>
    <label class="switch" for="locToggle">
      <span>Location</span>
      <input id="locToggle" type="checkbox" role="switch" aria-controls="place" checked>
      <span class="track" aria-hidden="true"><span class="knob"></span></span>
    </label>
  </div>
</footer>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">Camera check</h2>
      <button id="sheetClose" type="button">Done</button>
    </div>
    <div class="kit">
      <div id="tabs" class="strip tabs" aria-label="My cameras"></div>
      <div class="addrow">
        <button id="addHC" class="addbtn" type="button">+ Hand cam</button>
        <button id="addLS" class="addbtn" type="button">+ LS</button>
        <button id="removeCam" class="linkbtn" type="button">Remove this camera</button>
      </div>
    </div>
    <div class="pick">
      <select id="brand" aria-label="Camera brand">
        <option value="">Brand…</option><option>Canon</option><option>Fujifilm</option><option>Nikon</option><option>Sony</option><option value="Other">Other brand</option>
      </select>
      <select id="model" aria-label="Camera model" disabled><option value="">Model…</option></select>
    </div>
    <div id="recent" class="recent" aria-label="Recently used cameras"></div>
    <ol id="checklist" class="checklist"></ol>
    <p id="sheetNote" class="sheet-note"></p>
    <div class="endrow">
      <button id="newEvent" class="resetbtn neutral" type="button">New event: clear all ticks</button>
      <button id="resetAll" class="resetbtn" type="button">Reset all to default</button>
    </div>
  </div>
</div>

<div id="nextBar" class="nextbar" hidden role="status">
  <div class="nb-msg"><b id="nbTitle"></b><span id="nbSub"></span></div>
  <button id="nbNext" class="nb-next" type="button"></button>
  <button id="nbClose" class="nb-close" type="button" aria-label="Close">✕</button>
</div>

<script>
(function(){
  function pad(n,w){ n=String(n); while(n.length<(w||2)) n="0"+n; return n; }

  // ================= Time sync (NTP-style) =================
  // Public HTTPS time services backed by atomic-clock-disciplined NTP servers.
  var SOURCES = [
    {name:"time.akamai.com", url:"https://time.akamai.com/?iso&ms", text:true,
     parse:function(t){t=t.trim(); return /^\d+(\.\d+)?$/.test(t)?parseFloat(t)*1000:Date.parse(t);}},
    {name:"timeapi.io", url:"https://timeapi.io/api/time/current/zone?timeZone=UTC",
     parse:function(j){return Date.parse(j.dateTime.slice(0,23)+"Z");}},
    {name:"worldtimeapi.org", url:"https://worldtimeapi.org/api/timezone/Etc/UTC",
     parse:function(j){return Date.parse(j.utc_datetime);}}
  ];
  var offset = 0, synced = false, syncedAt = 0, source = "", accMs = 0;

  function sample(src){
    var t0 = performance.now(), w0 = Date.now();
    return fetch(src.url + "&_=" + w0, {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return src.text ? r.text() : r.json(); })
      .then(function(body){
        var rtt = performance.now() - t0, server = src.parse(body);
        if(!isFinite(server)) throw new Error("bad time");
        return {offset: server - (w0 + rtt/2), rtt: rtt, name: src.name};
      });
  }
  function syncFrom(i){
    if(i >= SOURCES.length) return Promise.reject(new Error("all failed"));
    var src = SOURCES[i];
    // 3 samples; keep the one with the shortest round trip (most accurate)
    return sample(src).then(function(a){
      return sample(src).then(function(b){
        return sample(src).then(function(c){ return [a,b,c].sort(function(x,y){return x.rtt-y.rtt;})[0]; },
                                function(){ return a.rtt<b.rtt?a:b; });
      }, function(){ return a; });
    }).catch(function(){ return syncFrom(i+1); });
  }
  var statusEl = document.getElementById("status"), syncText = document.getElementById("syncText"), detail = document.getElementById("detail");
  function sync(){
    statusEl.className = ""; syncText.textContent = "Syncing with time server…";
    syncFrom(0).then(function(best){
      offset = best.offset; synced = true; syncedAt = Date.now(); source = best.name; accMs = Math.max(1, Math.round(best.rtt/2));
      statusEl.className = "ok"; updateStatus();
    }).catch(function(){
      synced = false; offset = 0;
      statusEl.className = "bad"; syncText.textContent = "Offline — showing phone clock (not synced)"; detail.textContent = "";
    });
  }
  function updateStatus(){
    if(!synced) return;
    var mins = Math.floor((Date.now() - syncedAt)/60000);
    syncText.textContent = (mins < 1 ? "Synced less than a minute ago" : "Synced " + mins + " min ago") + " · ±" + accMs + " ms";
    var s = Math.abs(offset)/1000, sign = offset > 0 ? "−" : "+";
    detail.textContent = source + " · phone clock " + (Math.abs(offset) < 5 ? "exact" : sign + s.toFixed(2) + " s");
  }
  document.getElementById("resync").addEventListener("click", sync);

  // ================= LCD rendering =================
  var dayRow = document.getElementById("dayRow"), dateRow = document.getElementById("dateRow"), timeRow = document.getElementById("timeRow");
  var daydate = document.querySelector(".daydate"), mainEl = document.querySelector("main");

  // ---- LCD segments: rounded bars with clear gaps; unlit segments stay faintly visible ----
  var NS = "http://www.w3.org/2000/svg";
  // 14-segment LCD in the style of the reference: rounded bars with clear gaps, faint unlit segments.
  // Each segment is a straight line between two junction points, inset at both ends, drawn with round caps.
  var LCD_W = 62, LCD_H = 100, LCD_T = 11, LCD_GAP = 2.6;
  function lcdSegments(W, H, t, gap){
    var xl = t/2, xr = W - t/2, xc = W/2, yt = t/2, ym = H/2, yb = H - t/2;
    var J = { TL:[xl,yt], TR:[xr,yt], ML:[xl,ym], MR:[xr,ym], BL:[xl,yb], BR:[xr,yb], TC:[xc,yt], MC:[xc,ym], BC:[xc,yb] };
    function seg(p, q){
      var a = J[p], b = J[q], dx = b[0]-a[0], dy = b[1]-a[1], L = Math.hypot(dx,dy), ux = dx/L, uy = dy/L;
      var inset = t/2 + gap;                        // round cap reaches t/2, then a visible gap
      var r = function(v){ return Math.round(v*100)/100; };
      return [r(a[0]+ux*inset), r(a[1]+uy*inset), r(b[0]-ux*inset), r(b[1]-uy*inset)];
    }
    return {
      a:seg("TL","TR"), d:seg("BL","BR"), f:seg("TL","ML"), e:seg("ML","BL"), b:seg("TR","MR"), c:seg("MR","BR"),
      g:seg("ML","MR"), g1:seg("ML","MC"), g2:seg("MC","MR"), i:seg("TC","MC"), l:seg("MC","BC"),
      h:seg("TL","MC"), j:seg("TR","MC"), k:seg("BL","MC"), m:seg("BR","MC")
    };
  }
  // Digits use the 7 classic segments; letters use the 14-segment set (split middle bar)
  var DIGIT_SEGS = "a b c d e f g", LETTER_SEGS = "a b c d e f g1 g2 i l h j k m";
  var LCD_MAP = {
    "0":"a b c d e f", "1":"b c", "2":"a b g e d", "3":"a b g c d", "4":"f g b c", "5":"a f g c d",
    "6":"a f g e d c", "7":"a b c", "8":"a b c d e f g", "9":"a b c d f g", "-":"g", " ":"",
    A:"a b c e f g1 g2", B:"a b c d g2 i l", C:"a d e f", D:"a b c d i l", E:"a d e f g1", F:"a e f g1",
    G:"a c d e f g2", H:"b c e f g1 g2", I:"i l", J:"b c d", K:"e f g1 j m", L:"d e f",
    M:"b c e f h j", N:"b c e f h m", O:"a b c d e f", P:"a b e f g1 g2", Q:"a b c d e f m", R:"a b e f g1 g2 m",
    S:"a c d f g1 g2", T:"a i l", U:"b c d e f", V:"e f k j", W:"b c e f k m", X:"h j k m", Y:"h j l", Z:"a d j k"
  };
  var SEGS = lcdSegments(LCD_W, LCD_H, LCD_T, LCD_GAP), MAP = LCD_MAP;
  function charCell(letter){
    var svg = document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox", "-2 -2 " + (LCD_W+4) + " " + (LCD_H+4));
    var lines = {};
    (letter ? LETTER_SEGS : DIGIT_SEGS).split(" ").forEach(function(k){
      var p = SEGS[k], ln = document.createElementNS(NS,"line");
      ln.setAttribute("x1",p[0]); ln.setAttribute("y1",p[1]); ln.setAttribute("x2",p[2]); ln.setAttribute("y2",p[3]);
      ln.setAttribute("stroke-width", LCD_T); ln.setAttribute("class","off");
      svg.appendChild(ln); lines[k] = ln;
    });
    var cur = null;
    return {el:svg, set:function(ch){
      if(ch===cur) return; cur=ch;
      var on = " " + (MAP[ch]||"") + " ";
      for(var k in lines) lines[k].setAttribute("class", on.indexOf(" "+k+" ")>-1 ? "" : "off");
    }};
  }
  function sepCell(kind){
    var svg = document.createElementNS(NS,"svg"); svg.setAttribute("viewBox","0 -2 22 104"); svg.setAttribute("class","sep");
    (kind===":" ? [30,70] : [LCD_H - LCD_T/2]).forEach(function(y){

      ["X-T50 / X-T30 · mid", ["X-T50", "X-T30 III", "X-T30 II", "X-T30", "X-T20", "X-T10"]],
      ["X-E / X-M · compact", ["X-E5", "X-E4", "X-E3", "X-M5"]]
    ],
    Nikon: [
      ["Z mirrorless · full frame", ["Z9", "Z8", "Z7 / Z7II", "Z6III", "Z6 / Z6II", "Zf", "Z5II", "Z5"]],
      ["Z mirrorless · APS-C (DX)", ["Z50 / Z50II (APS-C)", "Z fc (APS-C)", "Z30 (APS-C)"]],
      ["DSLR · full frame", ["D6", "D5", "D4S", "D850", "D810", "D780", "D750", "Df", "D610"]],
      ["DSLR · APS-C (DX)", ["D500 (APS-C)", "D7500 (APS-C)", "D7200 (APS-C)", "D5600 (APS-C)", "D5500 (APS-C)", "D3500 (APS-C)", "D3400 (APS-C)"]]
    ]
  };
  // Cameras not in the list: same four checks, general wording
  var OTHER = "__other", OTHER_CAM = [OTHER, "", "", ""];
  function shortName(m){ return m === OTHER ? "Other model" : m.replace(" (APS-C)", ""); }
  function has(list, m){ return list.indexOf(m) > -1; }
  function findCam(b, m){ if(m === OTHER && (CAMS[b] || b === "Other")) return OTHER_CAM; var list = CAMS[b] || []; for(var i=0;i<list.length;i++) if(list[i][0] === m) return list[i]; return null; }

  // The four checks, worded the way each brand's menu words them
  var SIZE_ANY = "The <b>smallest</b> JPEG size whose long edge is <b>at least 4000 px</b>. Check the pixel numbers shown in the image size menu";
  function checks(b, c){
    var size = c[1], px = c[2];
    if(c[0] === OTHER){
      if(b === "Sony") return [
        ["White balance", "<b>AWB</b> · if there's Priority Set in AWB: <b>Standard</b>"],
        ["Creative Style / Look", "<b>Neutral (NT)</b>, or <b>Standard</b> if there's no Neutral"],
        ["JPEG quality", "<b>JPEG</b> only (RAW off), quality <b>Standard</b>"],
        ["Image size", SIZE_ANY]];
      if(b === "Canon") return [
        ["White balance", "<b>AWB</b> — regular Auto, not AWB W"],
        ["Picture Style", "<b>Neutral (N)</b>"],
        ["JPEG quality", "JPEG only (RAW off) with the <b>staircase</b> icon. If there's a JPEG quality 1–10 setting: <b>6</b>"],
        ["Image size", SIZE_ANY]];
      if(b === "Fujifilm") return [
        ["White balance", "<b>AUTO</b> — plain AUTO, not White or Ambience priority"],
        ["Film Simulation", "<b>PROVIA/STANDARD</b>"],
        ["Image quality", "<b>NORMAL</b> (no RAW)"],
        ["Image size", SIZE_ANY + " (3:2)"]];
      if(b === "Nikon") return [
        ["White balance", "<b>AUTO1</b> (Normal / Keep overall atmosphere), or plain <b>Auto</b> if there are no options"],
        ["Picture Control", "<b>Neutral (NL)</b>"],
        ["JPEG quality", "Image quality <b>JPEG normal</b> (no RAW)"],
        ["Image size", "Image area <b>FX</b> (DX on APS-C bodies). " + SIZE_ANY]];
      return [
        ["White balance", "<b>Auto</b> — the standard auto, not a warm/ambience or white-priority variant"],
        ["Picture style", "The most <b>neutral</b> profile (Neutral / Natural / Standard), no vivid or creative looks"],
        ["JPEG quality", "<b>JPEG</b> only (RAW off), the <b>middle</b> quality (Standard / Normal)"],
        ["Image size", SIZE_ANY]];
    }
    if(b === "Sony") return [
      ["White balance", has(SONY_NO_AWB_PRIORITY, c[0]) ? "<b>AWB</b> (Auto)" : "<b>AWB</b>, Priority Set in AWB → <b>Standard</b>"],
      [c[3] === "style" || c[3] === "style0" ? "Creative Style" : "Creative Look",
        c[3] === "style0" ? "<b>Standard</b> (this model has no Neutral)" :
        c[3] === "style" ? "<b>Neutral (NT)</b>" :
        c[3] === "look1" ? "<b>NT (Neutral)</b> · on firmware before 2.0: Creative Style → Neutral" : "<b>NT (Neutral)</b>"],
      ["JPEG quality", c[3] === "style" || c[3] === "style0" ? "Quality <b>Standard</b> (JPEG only, not RAW or RAW & JPEG)" : "File Format <b>JPEG</b> (RAW off), JPEG Quality <b>Standard</b>"],
      ["Image size", "JPEG Image Size <b>" + size + "</b> · " + px + " px"]
    ];
    if(b === "Canon") return [
      ["White balance", has(CANON_NO_AWBW, c[0]) ? "<b>AWB</b> (Auto)" : "<b>AWB</b> — regular Auto (Ambience priority), not AWB W"],
      ["Picture Style", "<b>Neutral (N)</b>"],
      ["JPEG quality", "JPEG only (RAW off) with the <b>staircase</b> icon. If there's a JPEG quality 1–10 setting: <b>6</b>, the first staircase step down from 10"],
      ["Image size", "Image quality <b>" + size + "</b> (staircase) · " + px + " px"]
    ];
    if(b === "Fujifilm") return [
      ["White balance", has(FUJI_AUTO_PRIORITY, c[0]) ? "<b>AUTO</b> — plain AUTO, not White or Ambience priority" : "<b>AUTO</b>"],
      ["Film Simulation", "<b>PROVIA/STANDARD</b>"],
      ["Image quality", "<b>NORMAL</b> (no RAW)"],
      ["Image size", "Image size <b>" + size + " 3:2</b> · " + px + " px"]
    ];
    return [
      ["White balance", has(NIKON_PLAIN_AUTO, c[0]) ? "<b>Auto</b> (this model has no AUTO0/1/2 options)" : has(NIKON_AUTO_NORMAL, c[0]) ? "<b>AUTO1</b> — Auto → Normal" : "<b>AUTO1</b> — Auto → Keep overall atmosphere"],
      ["Picture Control", "<b>Neutral (NL)</b>"],
      ["JPEG quality", "Image quality <b>JPEG normal</b> (no RAW)"],
      ["Image size", "Image area <b>" + c[3] + "</b>, Image size <b>" + size + "</b> · " + px + " px"]
    ];
  }

  var sheet = document.getElementById("sheet"), setBtn = document.getElementById("setBtn"), setCount = document.getElementById("setCount");
  var brandSel = document.getElementById("brand"), modelSel = document.getElementById("model");
  var recentEl = document.getElementById("recent"), listEl = document.getElementById("checklist"), noteEl = document.getElementById("sheetNote");
  var stripEl = document.getElementById("strip"), tabsEl = document.getElementById("tabs");
  var nextBar = document.getElementById("nextBar"), nbTitle = document.getElementById("nbTitle"), nbSub = document.getElementById("nbSub"), nbNext = document.getElementById("nbNext");

  // ---- My cameras: saved for good (up to 4 hand cams + 4 LS, each with its own brand/model) ----
  var MAXN = 4, kit = null, ev = null, recent = [];
  function key(c){ return c.type + " " + c.n; }
  function short(c){ return (c.type === "LS" ? "LS" : "HC") + c.n; }
  function sortKit(){ kit.cams.sort(function(x, y){ return (x.type === y.type ? 0 : x.type === "HAND CAM" ? -1 : 1) || x.n - y.n; }); }
  function act(){ for(var i=0;i<kit.cams.length;i++) if(key(kit.cams[i]) === kit.active) return kit.cams[i]; kit.active = key(kit.cams[0]); return kit.cams[0]; }
  function defaultKit(){
    // First run (or after reset): one hand cam, carrying over any camera chosen in the older version of the app
    var old = {}, om = {};
    try{ old = JSON.parse(localStorage.getItem("acCam") || "{}"); om = JSON.parse(localStorage.getItem("acModel") || "{}"); }catch(e){}
    var ok = om.b && findCam(om.b, om.m);
    var c = {type: old.t === "LS" ? "LS" : "HAND CAM", n: Math.min(MAXN, Math.max(1, +old.n || 1)), b: ok ? om.b : "", m: ok ? om.m : ""};
    return {cams:[c], active:key(c)};
  }
  try{ kit = JSON.parse(localStorage.getItem("acKit") || "null"); }catch(e){ kit = null; }
  if(!kit || !kit.cams || !kit.cams.length) kit = defaultKit();
  kit.cams.forEach(function(c){ if(c.b && !findCam(c.b, c.m)) c.m = ""; });
  sortKit();
  try{ recent = JSON.parse(localStorage.getItem("acRecent") || "[]").filter(function(r){ return findCam(r.b, r.m); }); }catch(e){}

  // ---- Ticks belong to one event: they start fresh each new day, or with "New event" ----
  function today(){ var d = new Date(Date.now() + offset); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
  try{ ev = JSON.parse(localStorage.getItem("acEvent") || "null"); }catch(e){ ev = null; }
  function syncEvent(){ if(!ev || ev.day !== today() || !ev.ticks) ev = {day: today(), ticks: {}}; }
  // A camera's ticks also start over if its brand or model changes
  function ticksOf(c){ syncEvent(); var k = key(c) + "|" + c.b + "|" + c.m; if(!ev.ticks[k]) ev.ticks[k] = [false,false,false,false]; return ev.ticks[k]; }
  function countOf(c){ return findCam(c.b, c.m) ? ticksOf(c).filter(Boolean).length : 0; }
  function isDone(c){ return countOf(c) === 4; }
  function save(){
    try{
      localStorage.setItem("acKit", JSON.stringify(kit));
      localStorage.setItem("acEvent", JSON.stringify(ev));
      localStorage.setItem("acRecent", JSON.stringify(recent));
    }catch(e){}
  }

  function chip(c, onClick){
    var bt = document.createElement("button"), n = countOf(c), has = !!findCam(c.b, c.m);
    bt.type = "button";
    bt.className = "chip" + (key(c) === kit.active ? " act" : "") + (n === 4 ? " ok" : "") + (!has ? " none" : "");
    bt.innerHTML = '<span class="nm"></span><span class="st"></span>';
    bt.firstChild.textContent = short(c);
    bt.lastChild.textContent = n === 4 ? "✓" : has ? n + "/4" : "set up";
    bt.setAttribute("aria-label", key(c) + (n === 4 ? ", checked" : has ? ", " + n + " of 4 checked" : ", not set up"));
    bt.addEventListener("click", onClick);
    return bt;
  }
  var addOpen = false;   // main-screen "+" expanded into "Hand cam" / "LS"
  function addChip(label, cls, onClick, disabled){
    var bt = document.createElement("button"); bt.type = "button"; bt.className = "chip " + cls; bt.textContent = label;
    bt.disabled = !!disabled; bt.addEventListener("click", onClick); return bt;
  }
  function renderStrips(){
    stripEl.textContent = ""; tabsEl.textContent = "";
    kit.cams.forEach(function(c){
      stripEl.appendChild(chip(c, function(){ addOpen = false; setActive(key(c)); if(!isDone(c)) openSheet(); }));
      tabsEl.appendChild(chip(c, function(){ setActive(key(c)); }));
    });
    var hc = kit.cams.filter(function(c){ return c.type === "HAND CAM"; }).length, ls = kit.cams.length - hc;
    // "+" on the main screen: tap to choose Hand cam or LS, then that camera's setup opens
    if(hc < MAXN || ls < MAXN){
      if(!addOpen){
        stripEl.appendChild(addChip("+", "plus", function(){ addOpen = true; renderStrips(); var e = stripEl.lastChild; if(e && e.scrollIntoView) e.scrollIntoView({inline:"end", block:"nearest"}); }));
      } else {
        stripEl.appendChild(addChip("+ Hand cam", "plusopt", function(){ addOpen = false; addCam("HAND CAM"); openSheet(); }, hc >= MAXN));
        stripEl.appendChild(addChip("+ LS", "plusopt", function(){ addOpen = false; addCam("LS"); openSheet(); }, ls >= MAXN));
        stripEl.appendChild(addChip("✕", "plus", function(){ addOpen = false; renderStrips(); }));
      }
    }
    document.getElementById("addHC").disabled = hc >= MAXN;
    document.getElementById("addLS").disabled = ls >= MAXN;
    document.getElementById("removeCam").hidden = kit.cams.length < 2;
  }
  function setActive(k){ kit.active = k; save(); hideNext(); refresh(); }
  function refresh(){
    var a = act();
    brandSel.value = a.b; fillModels(); renderRecent(); renderList(); renderStrips(); updateCam();
  }

  function fillModels(){
    var a = act();
    modelSel.textContent = "";
    var first = document.createElement("option"); first.value = ""; first.textContent = "Model…"; modelSel.appendChild(first);
    if(GROUPS[a.b]){
      // Grouped list: body type headings, flagship first, short names only
      GROUPS[a.b].forEach(function(g){
        var og = document.createElement("optgroup"); og.label = g[0];
        g[1].forEach(function(m){ if(!findCam(a.b, m)) return; var o = document.createElement("option"); o.value = m; o.textContent = shortName(m); og.appendChild(o); });
        modelSel.appendChild(og);
      });
    }
    if(a.b){
      var og2 = document.createElement("optgroup"); og2.label = "Not in the list";
      var o2 = document.createElement("option"); o2.value = OTHER; o2.textContent = a.b === "Other" ? "Any camera" : "Other " + a.b + " model";
      og2.appendChild(o2); modelSel.appendChild(og2);
    }
    modelSel.disabled = !a.b; modelSel.value = a.m || "";
  }
  function renderRecent(){
    var a = act();
    recentEl.textContent = "";
    recent.forEach(function(r){
      var bt = document.createElement("button"); bt.type = "button"; bt.textContent = r.b === "Other" ? "Other camera" : r.b + " " + shortName(r.m);
      if(r.b === a.b && r.m === a.m) bt.className = "cur";
      bt.addEventListener("click", function(){ choose(r.b, r.m); });
      recentEl.appendChild(bt);
    });
  }
  function renderList(){
    var a = act(), c = findCam(a.b, a.m);
    listEl.textContent = "";
    if(!c){ noteEl.textContent = "Choose the brand and model of " + key(a) + " to see its exact menu settings."; updateCount(); return; }
    var t = ticksOf(a);
    checks(a.b, c).forEach(function(item, i){
      var li = document.createElement("li"), lb = document.createElement("label"), cb = document.createElement("input"), sp = document.createElement("span");
      cb.type = "checkbox"; cb.id = "chk" + i; cb.checked = !!t[i];
      cb.addEventListener("change", function(){
        t[i] = cb.checked; save(); updateCount(); renderStrips();
        if(isDone(a)) setTimeout(function(){ closeSheet(); showNext(a); }, 350);
      });
      sp.innerHTML = '<span class="t"></span><span class="d">' + item[1] + "</span>";
      sp.firstChild.textContent = item[0];
      lb.appendChild(cb); lb.appendChild(sp); li.appendChild(lb); listEl.appendChild(li);
    });
    noteEl.textContent = "Image size is the smallest setting with a long edge of at least 4000 px. Your cameras stay saved; ticks start fresh each new day or with New event.";
    updateCount();
  }
  function updateCount(){
    var n = countOf(act());
    setCount.textContent = n + "/4"; setBtn.classList.toggle("done", n === 4);
  }
  function choose(b, m){
    var a = act(); a.b = b; a.m = m;
    if(b && m && findCam(b, m)) recent = [{b:b, m:m}].concat(recent.filter(function(r){ return !(r.b === b && r.m === m); })).slice(0, 6);
    save(); refresh();
  }
  brandSel.addEventListener("change", function(){ choose(brandSel.value, brandSel.value === "Other" ? OTHER : ""); });
  modelSel.addEventListener("change", function(){ choose(act().b, modelSel.value); });

  // ---- Add / remove cameras ----
  function addCam(type){
    var used = kit.cams.filter(function(c){ return c.type === type; }).map(function(c){ return c.n; });
    for(var n = 1; n <= MAXN; n++) if(used.indexOf(n) < 0) break;
    if(n > MAXN) return;
    var c = {type:type, n:n, b:"", m:""}; kit.cams.push(c); sortKit(); kit.active = key(c); save(); refresh();
  }
  document.getElementById("addHC").addEventListener("click", function(){ addCam("HAND CAM"); });
  document.getElementById("addLS").addEventListener("click", function(){ addCam("LS"); });
  // Remove the selected camera, close the gap in numbering (HC1, HC3, HC4 → HC1, HC2, HC3),
  // and select the one before it, so repeated taps remove 4 → 3 → 2 → 1
  document.getElementById("removeCam").addEventListener("click", function(){
    if(kit.cams.length < 2) return;
    var a = act(), type = a.type;
    var same = kit.cams.filter(function(c){ return c.type === type; });
    var pos = same.indexOf(a);
    kit.cams = kit.cams.filter(function(c){ return c !== a; });
    syncEvent();
    kit.cams.filter(function(c){ return c.type === type; }).forEach(function(c, i){
      var n = i + 1; if(c.n === n) return;
      // keep this event's ticks with the camera when its number changes
      var oldK = key(c) + "|" + c.b + "|" + c.m; c.n = n; var newK = key(c) + "|" + c.b + "|" + c.m;
      if(ev.ticks[oldK]){ ev.ticks[newK] = ev.ticks[oldK]; delete ev.ticks[oldK]; }
    });
    sortKit();
    var left = kit.cams.filter(function(c){ return c.type === type; });
    var pick = left.length ? left[Math.max(0, pos - 1)] : kit.cams[0];
    kit.active = key(pick); save(); refresh();
  });

  // ---- Next-camera prompt ----
  function nextAfter(a){
    var i = kit.cams.indexOf(a);
    for(var j = 1; j <= kit.cams.length; j++){ var c = kit.cams[(i + j) % kit.cams.length]; if(c !== a && !isDone(c)) return c; }
    return null;
  }
  var nextTarget = null;
  function showNext(a){
    nextTarget = nextAfter(a);
    nbTitle.textContent = "✓ " + key(a) + " ready";
    nbSub.textContent = nextTarget ? "Photograph the clock now, then go to the next camera." : "Photograph the clock now. That's every camera done.";
    nbNext.textContent = nextTarget ? "Next: " + key(nextTarget) + " →" : "All done ✓";
    nextBar.hidden = false;
  }
  function hideNext(){ nextBar.hidden = true; }
  nbNext.addEventListener("click", function(){
    hideNext();
    if(nextTarget){ setActive(key(nextTarget)); openSheet(); }
  });
  document.getElementById("nbClose").addEventListener("click", hideNext);

  function openSheet(){ hideNext(); sheet.hidden = false; document.getElementById("sheetClose").focus(); }
  function closeSheet(){ sheet.hidden = true; setBtn.focus(); }
  setBtn.addEventListener("click", openSheet);
  document.getElementById("sheetClose").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function(e){ if(e.target === sheet) closeSheet(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !sheet.hidden) closeSheet(); });

  // Two-tap buttons: first tap arms (red), second tap within 4 s acts
  function twoTap(btn, label, armedLabel, action){
    var t = null;
    btn.addEventListener("click", function(){
      if(!btn.classList.contains("armed")){
        btn.classList.add("armed"); btn.textContent = armedLabel;
        t = setTimeout(function(){ btn.classList.remove("armed"); btn.textContent = label; }, 4000);
        return;
      }
      clearTimeout(t); btn.classList.remove("armed"); action();
      btn.textContent = "Done ✓"; setTimeout(function(){ btn.textContent = label; }, 1800);
    });
  }
  twoTap(document.getElementById("newEvent"), "New event: clear all ticks", "Tap again to clear all ticks", function(){
    ev = {day: today(), ticks: {}}; save(); hideNext(); refresh();
  });
  twoTap(document.getElementById("resetAll"), "Reset all to default", "Tap again to reset everything", function(){
    try{ ["acCam","acModel","acRecent","acTicks","acKit","acEvent","acLoc"].forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
    camInit.value = ""; kit = defaultKit(); ev = {day: today(), ticks: {}}; recent = [];
    save(); hideNext(); refresh();
    showLoc = true; applyLoc();
  });

  // A new day starts a new event: re-check whenever the app comes back to the screen
  function dayCheck(){ var d = ev && ev.day; syncEvent(); if(ev.day !== d){ save(); hideNext(); refresh(); } }
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") dayCheck(); });
  setInterval(dayCheck, 60*1000);   // also clears at midnight while the app stays open
  refresh();

  // ================= Keep screen awake =================
  function wake(){ if(navigator.wakeLock && document.visibilityState==="visible") navigator.wakeLock.request("screen").catch(function(){}); }
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible"){ wake(); sync(); } });

  setInterval(sync, 10*60*1000);
  render(); applyLoc(); sync(); wake(); tick();
  window.addEventListener("load", fit); setTimeout(fit, 1000);
})();
</script>
 <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
    // Installed app: release any orientation lock left over from an older install
    try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
  </script>
